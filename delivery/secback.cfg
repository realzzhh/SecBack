# SecBack 配置（可选）
#
# 本文件全部注释掉 = 一切照默认走，行为和没有它完全一样。
#
# vault = 密库文件的位置
#   - 不写或注释掉：用程序同目录下的 sec.properties
#   - 可以写绝对路径，也可以写相对程序目录的路径
#   - 支持 %环境变量%，例如 %USERPROFILE%\Documents\sec.properties
#   - 所在的目录不存在会自动创建
#
# 建议把密库放到一个固定的位置（比如自己的文档目录）：这样以后更新程序、
# 换目录、重装，都不会因为"只换了 exe 没带密库"而从一个空库开始。
#
# 注意：路径写错时程序会拒绝进入并给出提示——这是故意的，
# 免得你在错误的位置新建一个空库、以为原来的数据丢了。
#
#vault = D:\我的密库\sec.properties
#vault = %USERPROFILE%\Documents\SecBack\sec.properties
