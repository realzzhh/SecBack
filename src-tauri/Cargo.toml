[package]
name = "secback"
version = "1.0.0"
edition = "2021"
description = "SecBack 本地密码本"

# 移动端要求有 cdylib 库目标：Android 的 Java 壳通过 JNI 调这里。
# 桌面端也走 lib（main.rs 只是个壳），两端逻辑完全共用，不写第二遍。
[lib]
name = "secback_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secback-core = { path = "../core" }

# 桌面专属：单实例和系统剪贴板在 Android 上没有对应概念
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
arboard = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
